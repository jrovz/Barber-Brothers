# Hace que logrotate corra cada hora en vez de una vez al día.
# Con "maxsize" en las reglas, así un pico de logs se recorta en máximo una hora y no
# en un día. Las reglas "daily" siguen rotando una sola vez al día.
# Instalar:
#   sudo mkdir -p /etc/systemd/system/logrotate.timer.d
#   sudo install -m 644 deployment/logrotate-cada-hora.conf /etc/systemd/system/logrotate.timer.d/cada-hora.conf
#   sudo systemctl daemon-reload && sudo systemctl restart logrotate.timer
[Timer]
OnCalendar=
OnCalendar=hourly
AccuracySec=1min
RandomizedDelaySec=5min
