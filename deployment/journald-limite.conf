# Tope al diario del sistema (journald). Sin esto llegó a ocupar 3,7 GB.
# Instalar:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo install -m 644 deployment/journald-limite.conf /etc/systemd/journald.conf.d/limite.conf
#   sudo systemctl restart systemd-journald
[Journal]
SystemMaxUse=500M
SystemKeepFree=1G
MaxRetentionSec=1month
